    <rect x="20" y="374" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><rect x="26" y="380" width="14" height="13" rx="2" fill="none" stroke="#A3A3A3" stroke-width="1.6"/><line x1="26" y1="385" x2="40" y2="385" stroke="#A3A3A3" stroke-width="1.6"/><text x="56" y="392">Date</text>
    <rect x="20" y="412" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><circle cx="33" cy="425" r="7" fill="none" stroke="#A3A3A3" stroke-width="1.6"/><path d="M33 421 v4 l3 2" stroke="#A3A3A3" stroke-width="1.6" fill="none"/><text x="56" y="430">Time</text>
  </g>
  <text x="20" y="468" font-size="11" font-weight="600" fill="#C9C9C9">MORE</text>
  <g font-size="14" fill="#1A1A1A">
    <rect x="20" y="478" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><path d="M33 483 l2.2 4.6 l5 .5 l-3.7 3.4 l1 4.9 l-4.5 -2.5 l-4.5 2.5 l1 -4.9 l-3.7 -3.4 l5 -.5 z" fill="none" stroke="#A3A3A3" stroke-width="1.2"/><text x="56" y="496">Rating</text>
    <rect x="20" y="516" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><text x="33" y="534" font-size="12" fill="#A3A3A3" text-anchor="middle">#</text><text x="56" y="534">Number</text>
    <rect x="20" y="554" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><path d="M33 574 v-8 a4 4 0 0 1 8 0 v8 m-12 -6 h16" stroke="#A3A3A3" stroke-width="1.5" fill="none" transform="translate(-2,-4)"/><text x="56" y="572">File upload</text>
    <rect x="20" y="592" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><path d="M26 608 q3 -8 6 0 q3 6 7 -4" stroke="#A3A3A3" stroke-width="1.5" fill="none" transform="translate(0,-2)"/><text x="56" y="610">Signature</text>
  </g>

  <!-- Canvas -->
  <rect x="260" y="56" width="880" height="844" fill="#FAFAFA"/>

  <!-- Form title card -->
  <rect x="380" y="88" width="640" height="118" rx="12" fill="#FFFFFF" stroke="#E8E8E8"/>
  <rect x="380" y="88" width="640" height="4" rx="2" fill="#FF5733"/>
  <text x="404" y="138" font-size="22" font-weight="600" fill="#1A1A1A" font-family="'Anek Devanagari', -apple-system, sans-serif">Customer Feedback — Q3</text>
  <text x="404" y="166" font-size="14" fill="#6B6B6B">Quarterly survey — takes about 2 minutes</text>

  <!-- Question 1 (selected) -->
  <rect x="380" y="230" width="640" height="252" rx="12" fill="#FFFFFF" stroke="#FF5733" stroke-width="1.5"/>
  <rect x="380" y="242" width="3" height="228" fill="#FF5733"/>
  <circle cx="396" cy="248" r="1.6" fill="#C9C9C9"/><circle cx="402" cy="248" r="1.6" fill="#C9C9C9"/><circle cx="396" cy="254" r="1.6" fill="#C9C9C9"/><circle cx="402" cy="254" r="1.6" fill="#C9C9C9"/><circle cx="396" cy="260" r="1.6" fill="#C9C9C9"/><circle cx="402" cy="260" r="1.6" fill="#C9C9C9"/>
  <text x="416" y="260" font-size="15" font-weight="600" fill="#1A1A1A">How satisfied are you with our service?</text>
  <rect x="880" y="242" width="120" height="28" rx="14" fill="#F5F5F5"/>
  <text x="912" y="260" font-size="13" fill="#6B6B6B">Rating</text>
  <path d="M978 253 l4 5 l4 -5" stroke="#6B6B6B" stroke-width="1.5" fill="none"/>
  <g font-size="13" text-anchor="middle">
    <circle cx="440" cy="316" r="17" fill="none" stroke="#D9D9D9" stroke-width="1.5"/><text x="440" y="321" fill="#A3A3A3">1</text>
    <circle cx="496" cy="316" r="17" fill="none" stroke="#D9D9D9" stroke-width="1.5"/><text x="496" y="321" fill="#A3A3A3">2</text>
    <circle cx="552" cy="316" r="17" fill="#FFF1EC" stroke="#FF5733" stroke-width="1.5"/><text x="552" y="321" fill="#FF5733" font-weight="600">3</text>
    <circle cx="608" cy="316" r="17" fill="none" stroke="#D9D9D9" stroke-width="1.5"/><text x="608" y="321" fill="#A3A3A3">4</text>
    <circle cx="664" cy="316" r="17" fill="none" stroke="#D9D9D9" stroke-width="1.5"/><text x="664" y="321" fill="#A3A3A3">5</text>
  </g>
  <text x="440" y="356" font-size="11" fill="#A3A3A3" text-anchor="middle">Poor</text>
  <text x="664" y="356" font-size="11" fill="#A3A3A3" text-anchor="middle">Excellent</text>
  <line x1="404" y1="430" x2="996" y2="430" stroke="#F0F0F0"/>
  <rect x="836" y="446" width="16" height="16" rx="3" fill="none" stroke="#A3A3A3" stroke-width="1.4"/>
  <rect x="840" y="442" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#A3A3A3" stroke-width="1.4"/>
  <path d="M886 444 v14 m-5 -9 l5 -4 l5 4 m-5 -4 v14" stroke="#A3A3A3" stroke-width="1.4" fill="none" transform="translate(-2,0)"/>
  <line x1="912" y1="444" x2="912" y2="464" stroke="#E8E8E8"/>
  <text x="924" y="460" font-size="12" fill="#6B6B6B">Required</text>
  <rect x="972" y="446" width="30" height="16" rx="8" fill="#FF5733"/>
  <circle cx="994" cy="454" r="6" fill="#FFFFFF"/>

  <!-- Question 2 -->
  <rect x="380" y="514" width="640" height="150" rx="12" fill="#FFFFFF" stroke="#E8E8E8"/>
  <text x="416" y="556" font-size="15" font-weight="600" fill="#1A1A1A">Any other feedback?</text>
  <rect x="880" y="538" width="120" height="28" rx="14" fill="#F5F5F5"/>
  <text x="906" y="556" font-size="13" fill="#6B6B6B">Paragraph</text>
  <path d="M978 549 l4 5 l4 -5" stroke="#6B6B6B" stroke-width="1.5" fill="none"/>
  <rect x="416" y="580" width="580" height="60" rx="8" fill="#FAFAFA" stroke="#D9D9D9" stroke-dasharray="5 4"/>
  <text x="428" y="602" font-size="13" fill="#A3A3A3">Long answer text</text>

  <!-- Add question -->
  <rect x="380" y="696" width="640" height="56" rx="12" fill="none" stroke="#D9D9D9" stroke-dasharray="6 5"/>
  <text x="700" y="730" font-size="14" font-weight="500" fill="#FF5733" text-anchor="middle">+ Add question</text>

  <!-- Right panel: question settings -->
  <rect x="1140" y="56" width="300" height="844" fill="#FFFFFF"/>
  <rect x="1140" y="56" width="1" height="844" fill="#E8E8E8"/>
  <text x="1160" y="92" font-size="11" font-weight="700" fill="#A3A3A3" letter-spacing="1.5">QUESTION SETTINGS</text>
  <text x="1160" y="124" font-size="12" fill="#6B6B6B">Answer type</text>
  <rect x="1160" y="132" width="260" height="36" rx="8" fill="#FFFFFF" stroke="#E8E8E8"/>
  <text x="1172" y="155" font-size="14" fill="#1A1A1A">Rating</text>
  <path d="M1398 147 l4 5 l4 -5" stroke="#6B6B6B" stroke-width="1.5" fill="none"/>
  <text x="1160" y="212" font-size="14" fill="#1A1A1A">Required</text>
  <rect x="1384" y="198" width="36" height="20" rx="10" fill="#FF5733"/>
  <circle cx="1410" cy="208" r="7" fill="#FFFFFF"/>
  <text x="1160" y="256" font-size="12" fill="#6B6B6B">Scale</text>
  <rect x="1160" y="264" width="124" height="36" rx="8" fill="#FFFFFF" stroke="#E8E8E8"/>
  <text x="1172" y="287" font-size="13" fill="#A3A3A3">Min: 1</text>
  <rect x="1296" y="264" width="124" height="36" rx="8" fill="#FFFFFF" stroke="#E8E8E8"/>
  <text x="1308" y="287" font-size="13" fill="#A3A3A3">Max: 5</text>
  <text x="1160" y="336" font-size="12" fill="#6B6B6B">Labels (optional)</text>
  <rect x="1160" y="344" width="124" height="36" rx="8" fill="#FFFFFF" stroke="#E8E8E8"/>
  <text x="1172" y="367" font-size="13" fill="#A3A3A3">Poor</text>
  <rect x="1296" y="344" width="124" height="36" rx="8" fill="#FFFFFF" stroke="#E8E8E8"/>
  <text x="1308" y="367" font-size="13" fill="#A3A3A3">Excellent</text>
  <text x="1160" y="428" font-size="14" fill="#1A1A1A">Show description</text>
  <rect x="1384" y="414" width="36" height="20" rx="10" fill="#E8E8E8"/>
  <circle cx="1394" cy="424" r="7" fill="#FFFFFF"/>
  <text x="1160" y="468" font-size="14" fill="#1A1A1A">Randomize choices</text>
  <rect x="1384" y="454" width="36" height="20" rx="10" fill="#E8E8E8"/>
  <circle cx="1394" cy="464" r="7" fill="#FFFFFF"/>

  <text x="380" y="800" font-size="12" fill="#A3A3A3">3-pane builder: palette · canvas · settings — every pane on the same 8px spacing grid, single font metric throughout</text>
</svg>
