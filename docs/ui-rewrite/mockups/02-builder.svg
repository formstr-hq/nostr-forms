<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="1440" height="900" fill="#FAFAFA"/>

  <!-- Builder header -->
  <rect width="1440" height="56" fill="#FFFFFF"/>
  <rect y="55.5" width="1440" height="1" fill="#E8E8E8"/>
  <path d="M34 28 l-8 0 m0 0 l5 -5 m-5 5 l5 5" stroke="#6B6B6B" stroke-width="1.8" fill="none"/>
  <line x1="26" y1="28" x2="16" y2="28" stroke="#6B6B6B" stroke-width="1.8"/>
  <text x="52" y="33" font-size="15" font-weight="600" fill="#1A1A1A">Customer Feedback — Q3</text>
  <rect x="258" y="19" width="14" height="14" rx="2" fill="none" stroke="#A3A3A3" stroke-width="1.3"/>
  <line x1="261" y1="30" x2="269" y2="22" stroke="#A3A3A3" stroke-width="1.3"/>
  <circle cx="292" cy="28" r="3" fill="#16A34A"/>
  <text x="302" y="33" font-size="12" fill="#A3A3A3">Saved · Draft</text>
  <rect x="1080" y="12" width="88" height="32" rx="8" fill="#FFFFFF" stroke="#E8E8E8"/>
  <text x="1124" y="32" font-size="13" font-weight="500" fill="#1A1A1A" text-anchor="middle">Preview</text>
  <rect x="1180" y="12" width="88" height="32" rx="8" fill="#FF5733"/>
  <text x="1224" y="32" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Publish</text>
  <circle cx="1392" cy="28" r="14" fill="#E8E8E8"/>
  <text x="1392" y="32" font-size="11" font-weight="500" fill="#6B6B6B" text-anchor="middle">A</text>

  <!-- Left panel: field palette -->
  <rect x="0" y="56" width="260" height="844" fill="#FFFFFF"/>
  <rect x="259.5" y="56" width="1" height="844" fill="#E8E8E8"/>
  <text x="20" y="92" font-size="11" font-weight="700" fill="#A3A3A3" letter-spacing="1.5">ADD FIELD</text>
  <text x="20" y="118" font-size="11" font-weight="600" fill="#C9C9C9">TEXT</text>
  <g font-size="14" fill="#1A1A1A">
    <rect x="20" y="128" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><line x1="26" y1="141" x2="40" y2="141" stroke="#A3A3A3" stroke-width="2"/><text x="56" y="146">Short answer</text>
    <rect x="20" y="166" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><line x1="26" y1="174" x2="40" y2="174" stroke="#A3A3A3" stroke-width="2"/><line x1="26" y1="180" x2="40" y2="180" stroke="#A3A3A3" stroke-width="2"/><line x1="26" y1="186" x2="34" y2="186" stroke="#A3A3A3" stroke-width="2"/><text x="56" y="184">Paragraph</text>
  </g>
  <text x="20" y="222" font-size="11" font-weight="600" fill="#C9C9C9">CHOICE</text>
  <g font-size="14" fill="#1A1A1A">
    <rect x="20" y="232" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><circle cx="33" cy="245" r="5" fill="none" stroke="#A3A3A3" stroke-width="1.6"/><circle cx="33" cy="245" r="2" fill="#A3A3A3"/><text x="56" y="250">Multiple choice</text>
    <rect x="20" y="270" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><rect x="27" y="277" width="12" height="12" rx="2" fill="none" stroke="#A3A3A3" stroke-width="1.6"/><path d="M29 283 l3 3 l5 -6" stroke="#A3A3A3" stroke-width="1.6" fill="none"/><text x="56" y="288">Checkboxes</text>
    <rect x="20" y="308" width="26" height="26" rx="6" fill="#F5F5F5" stroke="#E8E8E8"/><path d="M28 240 l5 6 l5 -6" transform="translate(0,81)" stroke="#A3A3A3" stroke-width="1.6" fill="none"/><text x="56" y="326">Dropdown</text>
  </g>
  <text x="20" y="364" font-size="11" font-weight="600" fill="#C9C9C9">DATE &amp; TIME</text>
