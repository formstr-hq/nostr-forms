<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bannerDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E1A12"/>
      <stop offset="1" stop-color="#1E1410"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="960" fill="#121212"/>

  <!-- Header -->
  <rect width="1440" height="64" fill="#1A1A1A"/>
  <rect y="63.5" width="1440" height="1" fill="#2A2A2A"/>
  <rect x="120" y="16" width="32" height="32" rx="8" fill="#FF5733"/>
  <text x="136" y="39" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle" font-family="'Anek Devanagari', sans-serif">f</text>
  <text x="162" y="39" font-size="20" font-weight="600" fill="#F2F2F2" font-family="'Anek Devanagari', -apple-system, sans-serif">formstr</text>
  <rect x="1120" y="14" width="128" height="36" rx="8" fill="#FF5733"/>
  <text x="1138" y="38" font-size="15" font-weight="500" fill="#FFFFFF">+</text>
  <text x="1154" y="38" font-size="14" font-weight="500" fill="#FFFFFF">Create Form</text>
  <path d="M1266 26 a6 6 0 0 1 12 0 c0 5 2 7 3 8 h-18 c1 -1 3 -3 3 -8 z" fill="none" stroke="#A8A8A8" stroke-width="1.5"/>
  <circle cx="1278" cy="24" r="4" fill="#FF5733"/>
  <circle cx="1304" cy="32" r="16" fill="#3A3A3A"/>
  <text x="1304" y="37" font-size="13" font-weight="500" fill="#D0D0D0" text-anchor="middle">A</text>

  <!-- Banner -->
  <rect x="400" y="88" width="640" height="176" rx="12" fill="url(#bannerDark)"/>
  <circle cx="950" cy="130" r="18" fill="#7A4636" opacity="0.6"/>
  <path d="M470 236 l60 -64 l44 44 l30 -30 l56 50 z" fill="#6B3D2C" opacity="0.5"/>
  <path d="M700 236 l50 -46 l40 46 z" fill="#593325" opacity="0.45"/>

  <!-- Title block -->
  <text x="400" y="312" font-size="28" font-weight="600" fill="#F2F2F2" font-family="'Anek Devanagari', -apple-system, sans-serif">Customer Feedback — Q3</text>
  <text x="400" y="344" font-size="15" fill="#A8A8A8">We'd love your input on this quarter's releases.</text>
  <text x="400" y="366" font-size="15" fill="#A8A8A8">Takes about 2 minutes · Responses are anonymous</text>

  <!-- Progress -->
  <text x="400" y="406" font-size="13" fill="#787878">Question 2 of 6</text>
  <text x="1040" y="406" font-size="13" fill="#787878" text-anchor="end">33%</text>
  <rect x="400" y="416" width="640" height="6" rx="3" fill="#2A2A2A"/>
  <rect x="400" y="416" width="213" height="6" rx="3" fill="#FF5733"/>

  <!-- Question card -->
  <rect x="400" y="444" width="640" height="356" rx="12" fill="#1E1E1E" stroke="#2E2E2E"/>
  <text x="424" y="490" font-size="16" font-weight="600" fill="#F2F2F2">How satisfied are you with our service?</text>
  <text x="424" y="512" font-size="13" fill="#787878">Select one</text>

  <g font-size="15" fill="#F2F2F2">
    <rect x="424" y="530" width="592" height="52" rx="8" fill="#2E1A12" stroke="#FF5733" stroke-width="1.5"/>
    <circle cx="450" cy="556" r="9" fill="none" stroke="#FF5733" stroke-width="1.8"/>
    <circle cx="450" cy="556" r="4.5" fill="#FF5733"/>
    <text x="470" y="561">Very satisfied</text>

    <rect x="424" y="594" width="592" height="52" rx="8" fill="#1E1E1E" stroke="#333333"/>
    <circle cx="450" cy="620" r="9" fill="none" stroke="#555555" stroke-width="1.8"/>
    <text x="470" y="625">Satisfied</text>

    <rect x="424" y="658" width="592" height="52" rx="8" fill="#1E1E1E" stroke="#333333"/>
    <circle cx="450" cy="684" r="9" fill="none" stroke="#555555" stroke-width="1.8"/>
    <text x="470" y="689">Neutral</text>

    <rect x="424" y="722" width="592" height="52" rx="8" fill="#1E1E1E" stroke="#333333"/>
    <circle cx="450" cy="748" r="9" fill="none" stroke="#555555" stroke-width="1.8"/>
    <text x="470" y="753">Dissatisfied</text>
  </g>

  <!-- Nav -->
  <text x="400" y="852" font-size="14" fill="#A8A8A8">← Back</text>
  <rect x="896" y="820" width="144" height="44" rx="8" fill="#FF5733"/>
  <text x="968" y="848" font-size="15" font-weight="500" fill="#FFFFFF" text-anchor="middle">Next →</text>

  <!-- Footer -->
  <rect x="640" y="902" width="16" height="16" rx="4" fill="#FF5733" opacity="0.6"/>
  <text x="664" y="915" font-size="12" fill="#787878">created using formstr</text>

  <text x="120" y="940" font-size="12" fill="#555555">Dark mode — same tokens, palette flipped via MUI theme.palette.mode; zero per-component dark CSS</text>
</svg>
